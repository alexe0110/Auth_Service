server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root /data;

    location @backend {
        proxy_pass http://ms-auth:8000;
    }

    location / {
        try_files $uri $uri/ @backend;
    }
    location /api/ {
        proxy_pass http://ms-auth:8000/api/;
    }
}