version: '3'

services:
  postgres:
    image: postgres:16.1
    restart: always
    env_file: 
      - "./core/.env"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.5
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data/
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 2s
      timeout: 60s
      retries: 5

  postgres-test:
    image: postgres:16.1
    restart: always
    env_file:
      - "./core/.env"
    ports:
      - "5434:5433"
  
  ms-auth:
    build:
      context: .
    env_file: 
      - "./core/.env"
    depends_on:
      - postgres
      - redis
    restart: always
    command: uvicorn main:app --host=0.0.0.0 --port=8000
  
  nginx:
    image: nginx:1.25.5
    container_name: nginx
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ms-auth

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local