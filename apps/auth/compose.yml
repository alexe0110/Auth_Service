services:
  auth-postgres:
    image: postgres:16.1
    restart: always
    env_file:
      - .env.db
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

  auth-redis:
    image: redis:7.2.5
    restart: always
    volumes:
      - auth-redis-data:/data/
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 2s
      timeout: 60s
      retries: 5

  auth-postgres-test:
    image: postgres:16.1
    restart: always
    profiles:
      - test
    env_file:
      - .env.db
    ports:
      - "5434:5432"

  auth-redis-test:
    image: redis:7.2.5
    profiles:
      - test
    ports:
      - "6380:6379"

  ms-auth:
    build:
      context: .
    env_file: 
      - ../.env
    depends_on:
      - auth-postgres
      - auth-redis
    restart: always
    command: uvicorn main:app --host=0.0.0.0 --port=8000

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "6831:6831/udp"
      - "16686:16686"

volumes:
  auth-postgres-data:
    driver: local
  auth-redis-data:
    driver: local