services:
  postgres:
    image: postgres:16.1
    restart: always
    env_file: ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d movies_database -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data2:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  
  redis:
    image: redis:7.2.5
    restart: always
    env_file: ../.env
    volumes:
        - redis_data:/data/
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 2s
      timeout: 60s
      retries: 5

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health?h=status | grep -q green"]
      interval: 2s
      timeout: 60s
      retries: 5

  movies:
    build:
      context: .
    env_file: ../.env
    depends_on:
      - postgres
      - elastic
      - redis
    restart: always
    command: ./local_up.sh


volumes:
  elastic_data:
    driver: local
  postgres_data2:
    driver: local
  redis_data:
    driver: local