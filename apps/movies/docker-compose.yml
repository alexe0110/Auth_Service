services:
  postgres:
    image: postgres:16.1
    restart: always
    env_file: ../.env
    expose:
        - 5432
    volumes:
        - ./dbs/postgresql-data:/var/lib/postgresql/data
  
  redis:
    image: redis:7.2.5
    restart: always
    env_file: ../.env
    expose:
        - 6379
    volumes:
        - redis_data:/data/
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 2s
      timeout: 60s
      retries: 5

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    expose:
      - 9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health?h=status | grep -q green"]
      interval: 2s
      timeout: 60s
      retries: 5

  movies:
    build:
      context: .
    env_file: ../.env
    depends_on:
      - postgres
      - elastic
      - redis
    restart: always
    command: ./local_up.sh

  nginx:
    image: nginx:1.25.5
    ports:
      - "8001:80"
    volumes:
      - ../../nginx.conf:/etc/nginx/nginx.conf:ro
      - ../configs:/etc/nginx/conf.d:ro
    depends_on:
      - movies

volumes:
  elastic_data:
    name: elastic_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./dbs/es_data
  postgres_data:
    name: postgres_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./dbs/postgres-data
  redis_data:
    name: redis_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./dbs/redis-data
