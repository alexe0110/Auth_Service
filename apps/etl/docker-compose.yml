services:
  etl:
    build:
      context: .
    env_file: ../.env
    depends_on:
      - postgres
      - elastic
    volumes:
      - etl_data:/usr/share/etl/data

volumes:
  etl_data:
    name: etl_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./dbs/etl-data
